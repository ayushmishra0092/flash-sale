syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.flashsale.grpc";
option java_outer_classname = "InventoryServiceProto";

package flashsale;

// Inventory Service for flash sale operations
service InventoryService {
  // Book inventory for a flash sale
  rpc BookInventory (BookingRequest) returns (BookingResponse);

  // Check inventory availability
  rpc CheckInventory (CheckInventoryRequest) returns (CheckInventoryResponse);

  // Get order status
  rpc GetOrderStatus (OrderStatusRequest) returns (OrderStatusResponse);
}

// Request to book inventory
message BookingRequest {
  string user_id = 1;
  int64 product_id = 2;
  int32 quantity = 3;
}

// Response for booking request
message BookingResponse {
  bool success = 1;
  string message = 2;
  string order_number = 3;
  BookingStatus status = 4;
}

enum BookingStatus {
  BOOKING_SUCCESS = 0;
  INSUFFICIENT_STOCK = 1;
  PRODUCT_NOT_FOUND = 2;
  SALE_NOT_ACTIVE = 3;
  BOOKING_FAILED = 4;
}

// Request to check inventory
message CheckInventoryRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

// Response for inventory check
message CheckInventoryResponse {
  bool available = 1;
  int32 available_stock = 2;
}

// Request for order status
message OrderStatusRequest {
  string order_number = 1;
}

// Response for order status
message OrderStatusResponse {
  bool found = 1;
  string status = 2;
  string order_number = 3;
  int64 product_id = 4;
  int32 quantity = 5;
}